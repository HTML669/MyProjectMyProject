<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <title>My Professional Shop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Phetsarath OT', sans-serif; }
        body { background: #f0f2f5; }
        header { background: #232f3e; color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 40px 5%; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s; cursor: pointer; }
        .card:hover { transform: translateY(-10px); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .info { padding: 20px; }
        .price { color: #B12704; font-size: 1.3rem; font-weight: bold; margin-top: 10px; }
        .btn { display: block; text-align: center; background: #ffd814; padding: 10px; border-radius: 20px; margin-top: 15px; font-weight: bold; text-decoration: none; color: black; }
    </style>
</head>
<body>
    <header>
        <h1 style="color: #febd69;">MY-SHOP</h1>
        <nav>ໜ້າຫຼັກ | ສິນຄ້າ | ກ່ຽວກັບເຮົາ</nav>
    </header>

    <div class="container" id="product-grid">
        <p>ກຳລັງໂຫຼດສິນຄ້າຈາກຖານຂໍ້ມູນ...</p>
    </div>

    <script>
        // ດຶງຂໍ້ມູນຈາກ API ທີ່ເຮົາຂຽນໄວ້ໃນ server.js
        fetch('/api/products')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('product-grid');
                grid.innerHTML = data.map(p => `
                    <div class="card" onclick="location.href='detail.html?id=${p.id}'">
                        <img src="${p.image}">
                        <div class="info">
                            <h3>${p.name}</h3>
                            <p class="price">${p.price} Kip</p>
                            <div class="btn">ເບິ່ງລາຍລະອຽດ</div>
                        </div>
                    </div>
                `).join('');
            })
            .catch(err => {
                document.getElementById('product-grid').innerHTML = "❌ ບໍ່ສາມາດເຊື່ອມຕໍ່ Backend ໄດ້. ຢ່າລືມຣັນ node server.js ເດີ້!";
            });
    </script>
</body>
</html>
